         different speeds and scales, Gaussian-blurred glints drifting over
         them, the whole thing masked to the painted water and optionally
         warped by a turbulence displacement. -->
    <!-- The river. The surface itself is what moves: 15 thin horizontal slices
         of the painted water, each shifted sideways on a phase-delayed sine, so
         a refraction wave travels downstream through the artwork. Over that sit
         travelling crescent wave lines and a field of sharp specular sparkles
         that twinkle. There is deliberately no soft overlay of any kind: a
         blurred sheet drifting over water reads as smoke, every time. -->

    <svg id="fxDefs" aria-hidden="true" width="0" height="0">
      <defs>
        <!-- the warp: fractal noise displaces the caustics so they ripple as
             they travel. Filter region is clamped to the river, so the cost is
             ~1130×150px, not the whole stage. -->
        <filter id="riverWarp" x="790" y="930" width="1140" height="160"
                filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency="0.013 0.052" numOctaves="2"
                        seed="7" stitchTiles="stitch" result="noise">
            <animate attributeName="baseFrequency" dur="19s" repeatCount="indefinite"
                     values="0.013 0.052; 0.017 0.045; 0.011 0.056; 0.013 0.052"/>
          </feTurbulence>
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="10"
                             xChannelSelector="R" yChannelSelector="G"/>
        </filter>
      </defs>
    </svg>

    <div id="weather" aria-hidden="true"><svg id="rainSvg" viewBox="0 0 1920 1080" preserveAspectRatio="none"></svg></div>

    <!-- ── tank  (Figma: x199 y10 723×1084 — empty-tank art fitted to the
             same glass interior, 351.6..765.9 × 122.9..953.5) ───────────── -->
    <div id="tank">
      <img id="tankArt" src="assets/img/water-tank-empty.png" alt="Water tank">

      <svg id="waterSvg" viewBox="0 0 414 831" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="gradBody" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0"    stop-color="#7fdcf8"/>
            <stop offset="0.28" stop-color="#2ab6ef"/>
            <stop offset="1"    stop-color="#0d8ad4"/>
          </linearGradient>
          <linearGradient id="gradBack" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#cdf4ff" stop-opacity=".9"/>
            <stop offset="1" stop-color="#37b2e6" stop-opacity=".9"/>
          </linearGradient>
          <linearGradient id="gradGlass" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0"    stop-color="#ffffff" stop-opacity=".14"/>
            <stop offset="0.16" stop-color="#ffffff" stop-opacity=".01"/>
            <stop offset="0.62" stop-color="#ffffff" stop-opacity=".10"/>
            <stop offset="0.70" stop-color="#ffffff" stop-opacity=".01"/>
            <stop offset="1"    stop-color="#ffffff" stop-opacity=".11"/>
          </linearGradient>
          <radialGradient id="vgRed" cx="38%" cy="30%">
            <stop offset="0"    stop-color="#ff9384"/>
            <stop offset="0.55" stop-color="#df3a27"/>
            <stop offset="1"    stop-color="#8b190c"/>
          </radialGradient>
          <linearGradient id="vgSteel" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0"   stop-color="#f4f8fb"/>
            <stop offset="0.5" stop-color="#c3d0da"/>
            <stop offset="1"   stop-color="#8fa2b0"/>
          </linearGradient>
          <linearGradient id="gStream" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0"   stop-color="#e6faff" stop-opacity=".96"/>
            <stop offset="0.45" stop-color="#8fe0f9" stop-opacity=".93"/>
            <stop offset="1"   stop-color="#2fb2ee" stop-opacity=".9"/>
          </linearGradient>
          <clipPath id="tankClip"><rect x="0" y="0" width="414" height="831" rx="12" ry="12"/></clipPath>
        </defs>
        <g clip-path="url(#tankClip)">
          <path id="waveBack"  fill="url(#gradBack)" opacity=".5"></path>
          <path id="waveFront" fill="url(#gradBody)"></path>
          <g    id="bubbles"></g>
          <g    id="surfFx"></g>
          <ellipse id="foam" rx="0" ry="0" fill="#ffffff" fill-opacity="0"></ellipse>
          <g    id="tickFx"></g>
          <ellipse id="surfRing" fill="none" stroke="#ffffff" stroke-opacity=".8" stroke-width="3"></ellipse>
          <path id="waveLine"  fill="none" stroke="#ffffff" stroke-opacity=".7" stroke-width="3" stroke-linecap="round"></path>
          <!-- 0 is the reference point the whole lesson turns on, so it is
               drawn into the tank rather than left to the label on the rail:
               a faint wash over each zone and a hard line between them. The
               y positions come from svgYFor(0) in game.js. -->
          <rect id="zoneAbove" x="0" width="414" fill="#ffffff" fill-opacity=".07"></rect>
          <rect id="zoneBelow" x="0" width="414" fill="#062a55" fill-opacity=".18"></rect>
          <g id="zeroBand">
            <rect id="zeroGlow" x="0" width="414" height="18" fill="#FFF200" fill-opacity=".22"></rect>
            <rect id="zeroLine" x="0" width="414" height="4" fill="#FFF200" fill-opacity=".95"></rect>
          </g>
          <rect x="0" y="0" width="414" height="831" fill="url(#gradGlass)"></rect>
        </g>
      </svg>


      <!-- inflow: column, moving highlight, drips, in-pipe direction dashes -->
      <svg id="flowIn" viewBox="0 0 714 1084" preserveAspectRatio="none" aria-hidden="true">
        <path id="colIn"   fill="url(#gStream)" opacity="0"></path>
        <path id="colInHi" fill="none" stroke="#ffffff" stroke-opacity=".8" stroke-width="4"
              stroke-linecap="round" stroke-dasharray="24 36" opacity="0"></path>
        <g id="dripsIn"></g>
      </svg>

      <div id="gauge"></div>

      <div id="marker" role="slider" aria-label="Water level" tabindex="0"
           aria-valuemin="-6" aria-valuemax="6" aria-valuenow="0">
        <img src="assets/img/marker-arrow-bold.png" alt="">
      </div>

      <!-- Where this move began. It drops onto the starting level and stays
           there for the whole screen, so "I started at −2, I am now at +2" is
           something the learner can see rather than has to remember. Reuses
           marker-dot-round.png, tinted so it reads as subordinate to the red
           live marker. -->
      <img id="startPin" src="assets/img/marker-dot-round.png" alt="" aria-hidden="true">

      <!-- One arc per level crossed, drawn from the start pin to the marker,
           with a running count. This is the number-line hop the learner will
           meet in the textbook, and it is the only place the SIZE of the move
           is visible rather than merely spoken. -->
      <svg id="hopFx" viewBox="0 0 714 1084" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <!-- lit along the ribbon, so the arc has a top and a bottom instead
               of being one flat navy shape -->
          <linearGradient id="gHop" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0"   stop-color="#1b4fa8"/>
            <stop offset=".45" stop-color="#0b2a6b"/>
            <stop offset="1"   stop-color="#061a45"/>
          </linearGradient>
        </defs>
        <g id="hopArcs"></g>
      </svg>
      <div id="hopCount" aria-hidden="true"><b id="hopN">0</b><i id="hopDir">▲</i></div>

      <!-- the ghost nudge: a see-through copy of the marker with a hand on
           it, dragged a short way and released, on a loop, until the learner
           touches the real one. It shows the gesture, never the answer — it
           travels the same distance whatever the target is. The hand is
           hand-nudge.png, cropped in CSS to drop the motion arcs the artwork
           carries — they read as sideways movement, and this drag is up and
           down. -->
      <div id="ghost" aria-hidden="true">
        <img class="ghostMarker" src="assets/img/marker-arrow-bold.png" alt="">
        <i id="ghostHand"></i>
      </div>

      <img id="pipeIn"  src="assets/img/pipe-inlet-s-bend.png"  alt="">
      <img id="pipeOut" src="assets/img/pipe-outlet-elbow.png" alt="">

      <!-- The in-pipe direction dashes used to live here. They were removed:
           the pipe artwork is opaque, fully-rendered steel with specular
           highlights, so anything drawn over it reads as paint on the surface
           rather than as fluid inside it — no amount of aligning them to the
           bore fixed that. Direction is still carried by the spinning valve,
           the pipe's own glow (#pipeIn.active / #pipeOut.active) and, most of
           all, the water column leaving the mouth. To bring them back properly
           the pipe needs redrawing with a glass or cut-away section and the
           dashes moved BEHIND it, showing through. -->

      <!-- valve wheels: coded stand-ins, swap for valve-wheel.png when the art lands -->
      <svg id="valveIn"  class="valve" viewBox="0 0 100 100" aria-hidden="true">
        <g stroke="url(#vgSteel)" stroke-width="12" stroke-linecap="round">
          <line x1="50" y1="14" x2="50" y2="86"/><line x1="14" y1="50" x2="86" y2="50"/>
          <line x1="24" y1="24" x2="76" y2="76"/><line x1="24" y1="76" x2="76" y2="24"/>
        </g>
        <circle cx="50" cy="50" r="41" fill="none" stroke="#5d1108" stroke-width="18" stroke-opacity=".35"/>
        <circle cx="50" cy="50" r="41" fill="none" stroke="url(#vgRed)" stroke-width="15"/>
        <circle cx="50" cy="50" r="15" fill="url(#vgSteel)" stroke="#5c6b77" stroke-width="3"/>
        <circle cx="45" cy="45" r="4"  fill="#ffffff" fill-opacity=".85"/>
      </svg>
      <svg id="valveOut" class="valve" viewBox="0 0 100 100" aria-hidden="true">
        <g stroke="url(#vgSteel)" stroke-width="12" stroke-linecap="round">
          <line x1="50" y1="14" x2="50" y2="86"/><line x1="14" y1="50" x2="86" y2="50"/>
          <line x1="24" y1="24" x2="76" y2="76"/><line x1="24" y1="76" x2="76" y2="24"/>
        </g>
        <circle cx="50" cy="50" r="41" fill="none" stroke="#5d1108" stroke-width="18" stroke-opacity=".35"/>
        <circle cx="50" cy="50" r="41" fill="none" stroke="url(#vgRed)" stroke-width="15"/>
        <circle cx="50" cy="50" r="15" fill="url(#vgSteel)" stroke="#5c6b77" stroke-width="3"/>
        <circle cx="45" cy="45" r="4"  fill="#ffffff" fill-opacity=".85"/>
      </svg>
    </div>

    <!-- outflow: leaves the tank, falls, lands in the river -->
    <svg id="flowOut" viewBox="0 0 1920 1080" preserveAspectRatio="none" aria-hidden="true">
      <g id="riverRings"></g>
      <path id="colOut"   fill="url(#gStream)" opacity="0"></path>
      <path id="colOutHi" fill="none" stroke="#ffffff" stroke-opacity=".75" stroke-width="4"
            stroke-linecap="round" stroke-dasharray="22 34" opacity="0"></path>
      <g id="dripsOut"></g>
      <g id="riverSplash"></g>
    </svg>

    <!-- ── character ──────────────────────────────────────────────────────
         Nine poses, every one re-registered to the same ground line, the same
         head-to-toe height and the same stance centre, so only the arms and
         face change when one swaps for another. Two stacked layers cross-fade
         between them. The box is sized so the body lands exactly where the
         single Figma still did: 637 px tall, feet at y965, centred on x1775. -->
    <div id="guddu" aria-hidden="true">
      <img class="pose" id="poseA" src="assets/img/guddu-talk.png" alt="">
      <img class="pose" id="poseB" alt="">
    </div>

    <!-- ── speech bubble  (Figma: x1222 y101 585×258) ───────────────────── -->
    <div id="bubble"><p id="bubbleText"></p></div>

    <!-- ── equation panel  (Figma: x884 y443 755×200) ─────────────────────
         Each box is colour-bound to the thing in the tank it describes: the
         first to the blue-grey start pin, the second to the navy jump arcs,
         the answer to the red marker. The pips under the middle box fill one
         per jump, so the 4 stops being a number to read and becomes a count to
         carry out and check against. -->
    <div id="eqPanel" hidden>
      <div class="eqBox bindStart" id="eqABox"><span id="eqA">0</span></div>
      <span class="eqSym" id="eqOp">+</span>
      <div class="eqBox bindJump" id="eqBBox"><span id="eqB">0</span>
        <div class="pips" id="eqPips"></div>
      </div>
      <span class="eqSym" id="eqEq">=</span>
      <div class="eqBox bindLand" id="eqRBox"><span id="eqR">?</span></div>
    </div>

    <!-- The three roles named, so the sentence reads as the thing the lesson
         is about: starting point, jumps, landing point. -->
    <div id="eqRoles" hidden>
      <b class="bindStart">started at</b>
      <b class="bindJump">jumped</b>
      <b class="bindLand">landed on</b>
    </div>

    <!-- The symbolic step. The gauge is where you work it out; this is where
         you say what you worked out. Options are generated from the sentence
         and every wrong one is a real mistake: the start unmoved, the jump
         taken the wrong way, the jump given instead of the landing, the
         negative start read as positive. -->
    <div id="answerTiles" hidden></div>

    <!-- ── the one remaining button  (Figma: x1136 y667 260×109) ────────
         Check and Continue are both gone: a tile tap and a marker coming to
         rest are the answer, and every screen moves on by itself. The finish
         screen is the one place that must not, so this is what it shows. -->
    <button id="nextBtn"  type="button" hidden><span>Play again</span></button>

    <!-- ── hud ──────────────────────────────────────────────────────────── -->
    <div id="chapterTag"><b id="chapterName">The Village Tank</b><i id="stepTag">1 / 20</i></div>
    <div id="hud">
      <div id="hudBtns">
        <button id="replayBtn" type="button" title="Say it again">&#x21BA;</button>
        <button id="muteBtn"   type="button" title="Sound on / off">&#x1F50A;</button>
      </div>
    </div>

    <!-- The hint strip is kept for the layout editor but is never filled:
         every line it used to carry was written for the game rather than taken
         from the flow doc, and the doc defines no on-screen hint text. -->
    <div id="hintBar"><span id="hintText"></span></div>

    <!-- ═══ QA ONLY — delete this block, plus the QA blocks in style.css and
         game.js, to remove the level jumper entirely ═══════════════════ -->
    <div id="qaPanel">
      <button id="qaTab" type="button">QA&nbsp;·&nbsp;jump</button>
      <div id="qaList"></div>
    </div>
    <!-- ═══ end QA ═══ -->

    <!-- ── the flood wipe: the river rises up over the whole screen, the next
             chapter is set up behind it, then it drains away to reveal it ─── -->
    <svg id="flood" viewBox="0 0 1920 1080" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="gFlood" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0"    stop-color="#9beefd"/>
          <stop offset="0.22" stop-color="#3cc4f3"/>
          <stop offset="1"    stop-color="#0a6cb2"/>
        </linearGradient>
      </defs>
      <path id="floodBody" fill="url(#gFlood)"></path>
      <g    id="floodBubbles"></g>
      <path id="floodFoam" fill="none" stroke="#ffffff" stroke-opacity=".9"
            stroke-width="6" stroke-linecap="round"></path>
      <path id="floodFoam2" fill="none" stroke="#ffffff" stroke-opacity=".45"
            stroke-width="3" stroke-linecap="round"></path>
    </svg>

    <!-- ── start gate ───────────────────────────────────────────────────── -->
    <div id="gate">
      <div class="gateCard">
        <h1>The Village Water Tank</h1>
        <p>Read the water level above and below&nbsp;0 — then work it out.</p>
        <button id="startBtn" type="button"><span>Start</span></button>
        <small>Turn your sound on — every instruction is read aloud.</small>
      </div>
    </div>

  </div>
</div>

<script src="layout.js"></script>
<script src="data.js"></script>
<script src="game.js"></script>
<!-- build tool: delete this line and editor.js for release -->
<script src="editor.js"></script>
</body>
</html>
